org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation. The project (G:) and the pub cache
# (C:, where plugin Kotlin sources live) are on different drives, and Kotlin's
# incremental cache tries to relativize paths across them, which Windows can't
# do ("different roots") — crashing the build. Full Kotlin compiles are fine
# for an app this size and unblock all Kotlin plugins (e.g. google_sign_in).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
